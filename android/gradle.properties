# jdk.net.unixdomain.tmpdir — БЕЗ ЭТОГО СБОРКА ANDROID НЕ ИДЁТ ВООБЩЕ.
# Gradle общается со своими рабочими процессами через java.nio Pipe, а JDK 16+
# делает такой конвейер на AF_UNIX-сокете — файле во временной папке. Если путь
# к temp приходит в «коротком» виде MS-DOS (C:\Users\ADMIN_~1\...), сокет по
# этому пути не создаётся: bind проходит, файла нет, connect падает
# «SocketException: Invalid argument: connect», и вся сборка валится с
# «java.io.IOException: Unable to establish loopback connection».
# Проверено: по обычному короткому пути (C:\dev\_tmp_java) AF_UNIX работает.
# Папка должна существовать — создаётся при первой сборке, но лучше держать.
org.gradle.jvmargs=-Djdk.net.unixdomain.tmpdir=C:\\dev\\_tmp_java -Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
